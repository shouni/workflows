name: Go CI

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: Time limit for each job (minutes)
        type: number
        default: 15
      golangci-lint-version:
        description: golangci-lint version used in CI
        type: string
        default: v2.14.0
      coverage:
        description: Measure coverage and write it to the step summary
        type: boolean
        default: false
      upload-coverage:
        description: Upload coverage.out as an artifact. Only meaningful when coverage is true
        type: boolean
        default: false
      apt-packages:
        description: apt packages to install before the tests (space-separated)
        type: string
        default: ''
      fuzz-targets:
        description: 'Space-separated "package#FunctionName". When empty, the fuzz job does not run at all'
        type: string
        default: ''
      fuzz-time:
        description: Fuzz time per target
        type: string
        default: 20s

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install apt packages
        if: inputs.apt-packages != ''
        # Fits three attempts. One attempt is timeout 60 + timeout 120 + sleep 10 = 190 seconds; three are 570 seconds.
        # If the commands' timeouts change, revisit this value too.
        timeout-minutes: 10
        env:
          PACKAGES: ${{ inputs.apt-packages }}
        run: |
          # Split the space-separated list into an array explicitly. Relying on word splitting of a bare $PACKAGES trips shellcheck SC2086.
          read -ra PKGS <<< "$PACKAGES"
          for attempt in 1 2 3; do
            if timeout 60 sudo apt-get update \
              && timeout 120 sudo apt-get install -y --no-install-recommends "${PKGS[@]}"; then
              exit 0
            fi
            echo "::warning::apt failed or stalled (attempt ${attempt}/3); retrying" >&2
            sleep 10
          done
          echo "::error::could not install apt packages: $PACKAGES" >&2
          exit 1

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt check
        run: test -z "$(gofmt -l .)"

      - name: Test
        if: ${{ !inputs.coverage }}
        run: go test -shuffle=on -race ./...

      - name: Test (with coverage)
        if: inputs.coverage
        run: go test -shuffle=on -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        if: inputs.coverage
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          {
            echo "### Coverage"
            echo '```'
            tail -n 1 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: inputs.coverage && inputs.upload-coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.golangci-lint-version }}

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  fuzz:
    name: Fuzz (smoke)
    if: inputs.fuzz-targets != ''
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Fuzz
        env:
          TARGETS: ${{ inputs.fuzz-targets }}
          FUZZTIME: ${{ inputs.fuzz-time }}
        run: |
          # The default shell is not pipefail, so keep a go test failure from being hidden by tee's success.
          set -o pipefail
          log="$(mktemp)"
          for spec in $TARGETS; do
            pkg="${spec%%#*}"
            fn="${spec##*#}"
            echo "::group::${pkg} ${fn}"
            go test "$pkg" -run '^$' -fuzz "^${fn}$" -fuzztime "$FUZZTIME" 2>&1 | tee "$log"
            # When -fuzz matches nothing, go test prints a warning and returns exit 0. Judged by the exit
            # code alone, a rename, typo or package move becomes a green no-op (README "Design decisions").
            if grep -q 'no fuzz tests to fuzz' "$log"; then
              echo "::error::${fn} not found in ${pkg} (renamed or misspelled). Fix fuzz-targets." >&2
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Upload fuzz failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus
          path: "**/testdata/fuzz/"
          retention-days: 7
          if-no-files-found: ignore
