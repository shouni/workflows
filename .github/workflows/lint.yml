# このリポジトリ自身の CI。go-ci.yml を含むワークフローを actionlint に掛ける。
# 理由・版を固定する理由・手元で動かすときの落とし穴は README「自分のワークフローは
# actionlint に掛ける」にある。
#
# `paths:` フィルタは付けない。このチェックは main の必須ステータスチェックにしてあり、
# skip されたチェックは「成功」ではなく「未報告」になるため、ワークフローを触らない PR が
# 永久にマージできなくなる。全 PR で走らせるのが条件。

name: Lint workflows

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # このリポジトリは Go のコードを持たない。go.mod が無いので go-version を明示し、
      # キャッシュも切る（既定の true のままだと go.mod を探して毎回 warning を出す）。
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: actionlint
        run: actionlint -color
