# This repository's own CI. Runs actionlint over the workflows, go-ci.yml included.
# The reasons, why the version is pinned and the pitfall when running it locally are in
# README "Lint your own workflows with actionlint".
#
# No `paths:` filter. This check is a required status check on main, and a skipped check
# counts as "not reported" rather than "passed", so a PR that does not touch the workflows
# could never be merged. It has to run on every PR.

name: Lint workflows

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This repository has no Go code. With no go.mod, set go-version explicitly and turn
      # the cache off (left at the default true, it looks for go.mod and warns every run).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: actionlint
        run: actionlint -color
