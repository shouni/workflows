# 各設定の理由（gomod を宣言しない理由を含む）は README の「Dependabot の規約」にある。
# ここでの更新は `v1` を動かすまで消費側に届かない（README「変更を反映する手順」）。
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
