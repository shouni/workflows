# 各設定の理由は README の「Dependabot の規約」にある。
# Go のコードを持たないので gomod は宣言しない。
#
# ここで上げても消費側にはすぐ届かない。消費側は @v1 を参照しているだけなので、
# タグを動かして初めて反映される（README「変更を反映する手順」）。
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
