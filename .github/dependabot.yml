# The reason for each setting (including why gomod is not declared) is in README "Dependabot conventions".
# Updates here do not reach consumers until `v1` is moved (README "Rolling out a change").
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
